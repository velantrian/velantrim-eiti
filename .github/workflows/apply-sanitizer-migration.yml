name: Apply sanitizer migration

on:
  push:
    branches: ["fix/sanitizer-fail-closed"]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanitizer-fail-closed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fail-closed sanitizer migration
        run: python scripts/migrate_sanitizer_fail_closed.py
      - name: Run focused security tests
        run: node --test velantrim_core/tests_js/safe_html.test.js
      - name: Remove one-shot migration hook and commit result
        run: |
          rm scripts/migrate_sanitizer_fail_closed.py
          rm .github/workflows/apply-sanitizer-migration.yml
          git config user.name "Velantrim CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): fail closed when HTML sanitizer is unavailable"
          git push origin HEAD:fix/sanitizer-fail-closed
