name: Tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bounded-followup:
    name: Bounded admission consistency delivery
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/eiti-admission-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eiti-admission-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply consistency follow-up
        run: python .github/bounded_followup.py
      - name: Run JS regression suite
        run: node --test velantrim_core/tests_js/*.test.js
      - name: Clean delivery scaffolding and push
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/test.yml > .github/workflows/test.yml
          rm -f .github/bounded_followup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html velantrim_core/tests_js/l3_durability_boundary.test.js .github/workflows/test.yml .github/bounded_followup.py
          git commit -m 'fix(memory): preserve L3 durability without epistemic promotion'
          git push origin HEAD:fix/eiti-admission-hardening

  js-unit:
    name: JS unit tests (index.html pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node test runner
        run: node --test velantrim_core/tests_js/*.test.js

  python-core:
    name: Python KB tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: velantrim_core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        working-directory: velantrim_core
        run: pytest tests/ -v

  e2e-smoke:
    name: Playwright smoke tests (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + browser
        working-directory: velantrim_core/e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: velantrim_core/e2e
        run: npx playwright test --reporter=line
